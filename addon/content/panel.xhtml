<?xml version="1.0" encoding="UTF-8"?>
<!--
  Host document for Zest's two windows (reading statistics, annotation matrix).

  Shipping our own document instead of reusing Zotero's basicViewer: that one is
  meant to display a loaded URI and closes itself when it has none, which made
  the windows vanish under us. This is deliberately empty — the module fills it.
-->
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" />
    <title>Zest</title>
  </head>
  <body class="zest-panel-host"></body>
</html>
