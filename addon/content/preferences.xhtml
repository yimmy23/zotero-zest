<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
  <html:link
    rel="stylesheet"
    href="chrome://__addonRef__/content/preferences.css"
  />
</linkset>
<vbox
  id="zest-prefs"
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <groupbox>
    <label><html:h2 data-l10n-id="pref-group-columns"></html:h2></label>
    <checkbox
      preference="column.reading.enable"
      data-l10n-id="pref-column-reading"
      native="true"
    />
    <checkbox
      preference="column.status.enable"
      data-l10n-id="pref-column-status"
      native="true"
    />
    <checkbox
      preference="column.rating.enable"
      data-l10n-id="pref-column-rating"
      native="true"
    />
    <checkbox
      preference="column.tags.enable"
      data-l10n-id="pref-column-tags"
      native="true"
    />
    <checkbox
      preference="tags.hideInTitle"
      data-l10n-id="pref-tags-hide-in-title"
      native="true"
    />
    <checkbox
      preference="column.textTags.enable"
      data-l10n-id="pref-column-texttags"
      native="true"
    />
    <hbox align="center">
      <html:label data-l10n-id="pref-texttags-match"></html:label>
      <html:input
        type="text"
        style="flex: 1"
        preference="textTags.match"
      ></html:input>
    </hbox>
    <description
      class="zest-pref-hint"
      data-l10n-id="pref-texttags-match-hint"
    ></description>
    <hbox align="center">
      <html:label data-l10n-id="pref-texttags-color"></html:label>
      <html:input type="color" preference="textTags.color"></html:input>
      <html:label
        data-l10n-id="pref-texttags-textcolor"
        style="margin-inline-start: 12px"
      ></html:label>
      <html:input
        type="text"
        style="width: 8em"
        preference="textTags.textColor"
      ></html:input>
    </hbox>
    <hbox align="center">
      <html:label data-l10n-id="pref-rating-mark"></html:label>
      <html:input
        type="text"
        style="width: 3em"
        preference="rating.mark"
      ></html:input>
      <html:label
        data-l10n-id="pref-rating-option"
        style="margin-inline-start: 12px"
      ></html:label>
      <html:input
        type="text"
        style="width: 3em"
        preference="rating.option"
      ></html:input>
      <html:label
        data-l10n-id="pref-rating-color"
        style="margin-inline-start: 12px"
      ></html:label>
      <html:input
        type="text"
        style="width: 7em"
        preference="rating.color"
      ></html:input>
      <html:label
        data-l10n-id="pref-rating-key"
        style="margin-inline-start: 12px"
      ></html:label>
      <menulist preference="rating.extraKey" native="true">
        <menupopup>
          <menuitem label="rate" value="rate" />
          <menuitem label="Rating" value="Rating" />
        </menupopup>
      </menulist>
    </hbox>
    <checkbox
      preference="extra.stripOnExport"
      data-l10n-id="pref-extra-strip"
      native="true"
    />
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-group-appearance"></html:h2></label>
    <description
      class="zest-pref-hint"
      data-l10n-id="pref-accent-hint"
    ></description>
    <hbox align="center">
      <html:label data-l10n-id="pref-accent-color"></html:label>
      <html:input type="color" preference="ui.accent"></html:input>
      <html:div
        id="zest-pref-accent-presets"
        class="zest-pref-swatches"
      ></html:div>
    </hbox>
    <hbox align="center">
      <button
        id="zest-pref-accent-apply"
        data-l10n-id="pref-accent-apply"
        oncommand="
          Zotero.__addonInstance__.hooks.onPrefsEvent('accent-apply', {
            window,
          })
        "
        native="true"
      />
      <button
        id="zest-pref-accent-reset"
        data-l10n-id="pref-accent-reset"
        oncommand="
          Zotero.__addonInstance__.hooks.onPrefsEvent('accent-reset', {
            window,
          })
        "
        native="true"
      />
    </hbox>
    <description
      class="zest-pref-hint"
      data-l10n-id="pref-accent-apply-hint"
    ></description>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-group-heat"></html:h2></label>
    <checkbox
      preference="titleDecor.heat"
      data-l10n-id="pref-titledecor-heat"
      native="true"
    />
    <checkbox
      preference="titleDecor.unreadBold"
      data-l10n-id="pref-titledecor-unread"
      native="true"
    />
    <checkbox
      preference="titleDecor.unreadIncludesEmpty"
      data-l10n-id="pref-titledecor-unread-empty"
      native="true"
      style="margin-inline-start: 20px"
    />
    <hbox align="center">
      <html:label data-l10n-id="pref-heat-color"></html:label>
      <html:input type="color" preference="heat.color"></html:input>
      <html:label
        data-l10n-id="pref-heat-opacity"
        style="margin-inline-start: 12px"
      ></html:label>
      <html:input
        type="number"
        min="0.1"
        max="1"
        step="0.05"
        preference="heat.opacity"
      ></html:input>
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-group-tracker"></html:h2></label>
    <checkbox
      preference="tracker.enable"
      data-l10n-id="pref-tracker-enable"
      native="true"
    />
    <hbox align="center">
      <html:label data-l10n-id="pref-tracker-idle"></html:label>
      <html:input
        type="number"
        min="10"
        max="3600"
        preference="tracker.idleSeconds"
      ></html:input>
    </hbox>
    <checkbox
      preference="status.derive"
      data-l10n-id="pref-status-derive"
      native="true"
    />
    <checkbox
      preference="statusAuto.enable"
      data-l10n-id="pref-statusauto-enable"
      native="true"
    />
    <checkbox
      preference="statusAuto.markEmpty"
      data-l10n-id="pref-statusauto-markempty"
      native="true"
      style="margin-inline-start: 20px"
    />
    <hbox align="center">
      <html:label data-l10n-id="pref-statusauto-threshold"></html:label>
      <html:input
        type="number"
        min="10"
        max="100"
        preference="statusAuto.readThreshold"
      ></html:input>
      <html:label
        data-l10n-id="pref-statusauto-minminutes"
        style="margin-inline-start: 12px"
      ></html:label>
      <html:input
        type="number"
        min="0"
        max="600"
        preference="statusAuto.minMinutes"
      ></html:input>
    </hbox>
    <description
      class="zest-pref-hint"
      data-l10n-id="pref-tracker-storage-hint"
    ></description>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-group-data"></html:h2></label>
    <hbox align="center">
      <button
        data-l10n-id="pref-btn-migrate"
        oncommand="
          Zotero.__addonInstance__.hooks.onPrefsEvent('migrate', { window })
        "
      />
      <button
        data-l10n-id="pref-btn-export-json"
        oncommand="
          Zotero.__addonInstance__.hooks.onPrefsEvent('export-json', { window })
        "
      />
      <button
        data-l10n-id="pref-btn-export-csv"
        oncommand="
          Zotero.__addonInstance__.hooks.onPrefsEvent('export-csv', { window })
        "
      />
      <button
        data-l10n-id="pref-btn-import"
        oncommand="
          Zotero.__addonInstance__.hooks.onPrefsEvent('import', { window })
        "
      />
    </hbox>
    <description class="zest-pref-hint" id="zest-pref-dbpath"></description>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-group-tags"></html:h2></label>
    <checkbox
      preference="nestedTags.show"
      data-l10n-id="pref-nested-show"
      native="true"
    />
    <hbox align="center">
      <html:label data-l10n-id="pref-nested-link"></html:label>
      <menulist preference="nestedTags.linkSymbol" native="true">
        <menupopup>
          <menuitem value="/" label="/" />
          <menuitem value="+" label="+" />
          <menuitem value="-" label="-" />
          <menuitem value=":" label=":" />
          <menuitem value="~" label="~" />
          <menuitem value=">" label=">" />
          <menuitem value="&lt;" label="&lt;" />
        </menupopup>
      </menulist>
      <html:label
        data-l10n-id="pref-nested-sort"
        style="margin-inline-start: 12px"
      ></html:label>
      <menulist preference="nestedTags.sort" native="true">
        <menupopup>
          <menuitem value="az" data-l10n-id="pref-nested-sort-az" />
          <menuitem value="za" data-l10n-id="pref-nested-sort-za" />
          <menuitem
            value="freq-desc"
            data-l10n-id="pref-nested-sort-freq-desc"
          />
          <menuitem value="freq-asc" data-l10n-id="pref-nested-sort-freq-asc" />
        </menupopup>
      </menulist>
    </hbox>
    <checkbox
      preference="nestedTags.matchChildTags"
      data-l10n-id="pref-nested-childtags"
      native="true"
    />
    <description
      class="zest-pref-hint"
      data-l10n-id="pref-nested-hint"
    ></description>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-group-rank"></html:h2></label>
    <checkbox
      preference="column.pubtags.enable"
      data-l10n-id="pref-column-pubtags"
      native="true"
    />
    <checkbox
      preference="column.if.enable"
      data-l10n-id="pref-column-if"
      native="true"
    />
    <checkbox
      preference="column.venue.enable"
      data-l10n-id="pref-column-venue"
      native="true"
    />
    <hbox align="center">
      <html:label data-l10n-id="pref-rank-fields"></html:label>
      <html:input
        type="text"
        style="flex: 1"
        preference="rank.fields"
      ></html:input>
    </hbox>
    <description
      class="zest-pref-hint"
      data-l10n-id="pref-rank-fields-hint"
    ></description>
    <hbox align="center">
      <html:label data-l10n-id="pref-rank-sortby"></html:label>
      <html:input
        type="text"
        style="flex: 1"
        preference="rank.sortBy"
      ></html:input>
    </hbox>
    <description
      class="zest-pref-hint"
      data-l10n-id="pref-rank-sortby-hint"
    ></description>
    <hbox align="center">
      <html:label data-l10n-id="pref-rank-map"></html:label>
      <html:input
        type="text"
        style="flex: 1"
        preference="rank.map"
      ></html:input>
    </hbox>
    <description
      class="zest-pref-hint"
      data-l10n-id="pref-rank-map-hint"
    ></description>
    <hbox align="center">
      <html:label data-l10n-id="pref-rank-colors"></html:label>
      <html:input
        type="text"
        style="flex: 1"
        preference="rank.colors"
      ></html:input>
    </hbox>
    <description
      class="zest-pref-hint"
      data-l10n-id="pref-rank-colors-hint"
    ></description>
    <hbox align="center">
      <html:label data-l10n-id="pref-rank-defaultcolor"></html:label>
      <html:input
        type="color"
        preference="rank.defaultColor"
        class="zest-pref-autocolor"
      ></html:input>
      <button
        data-l10n-id="pref-color-auto"
        data-zest-pref="rank.defaultColor"
        oncommand="
          Zotero.__addonInstance__.hooks.onPrefsEvent('color-auto', {
            window,
            pref: 'rank.defaultColor',
          })
        "
        native="true"
      />
      <html:label
        data-l10n-id="pref-rank-textcolor"
        style="margin-inline-start: 12px"
      ></html:label>
      <html:input
        type="text"
        style="width: 8em"
        preference="rank.textColor"
      ></html:input>
      <html:label
        data-l10n-id="pref-rank-opacity"
        style="margin-inline-start: 12px"
      ></html:label>
      <html:input
        type="text"
        style="width: 5em"
        preference="rank.opacity"
      ></html:input>
    </hbox>
    <hbox align="center">
      <html:label data-l10n-id="pref-rank-ttl"></html:label>
      <html:input
        type="number"
        min="0"
        max="3650"
        preference="rank.ttlDays"
      ></html:input>
    </hbox>
    <checkbox
      preference="rank.useEasyScholar"
      data-l10n-id="pref-rank-easyscholar"
      native="true"
    />
    <checkbox
      preference="rank.useOpenAlex"
      data-l10n-id="pref-rank-openalex"
      native="true"
    />
    <checkbox
      preference="rank.autoFetch"
      data-l10n-id="pref-rank-autofetch"
      native="true"
    />
    <hbox align="center">
      <html:label data-l10n-id="pref-key-label"></html:label>
      <html:input
        type="password"
        id="zest-pref-eskey"
        class="zest-pref-key"
        style="flex: 1"
      ></html:input>
      <button
        data-l10n-id="pref-key-save"
        oncommand="
          Zotero.__addonInstance__.hooks.onPrefsEvent('key-save', { window })
        "
      />
      <button
        data-l10n-id="pref-key-test"
        oncommand="
          Zotero.__addonInstance__.hooks.onPrefsEvent('key-test', { window })
        "
      />
    </hbox>
    <description id="zest-pref-keystatus" class="zest-pref-hint"></description>
    <description
      class="zest-pref-hint"
      data-l10n-id="pref-key-hint"
    ></description>
    <button
      data-l10n-id="pref-rank-clear"
      oncommand="
        Zotero.__addonInstance__.hooks.onPrefsEvent('rank-clear', { window })
      "
    />
    <hbox align="center">
      <html:label data-l10n-id="pref-if-field"></html:label>
      <html:input
        type="text"
        style="width: 8em"
        preference="if.field"
      ></html:input>
      <html:label
        data-l10n-id="pref-if-max"
        style="margin-inline-start: 12px"
      ></html:label>
      <html:input
        type="number"
        min="1"
        max="100"
        preference="if.max"
      ></html:input>
    </hbox>
    <hbox align="center">
      <html:label data-l10n-id="pref-if-style"></html:label>
      <menulist preference="if.style" native="true">
        <menupopup>
          <menuitem value="heat" data-l10n-id="pref-if-style-heat" />
          <menuitem value="bar" data-l10n-id="pref-if-style-bar" />
          <menuitem value="none" data-l10n-id="pref-if-style-none" />
        </menupopup>
      </menulist>
    </hbox>
    <checkbox preference="if.info" data-l10n-id="pref-if-info" native="true" />
    <hbox align="center">
      <html:label data-l10n-id="pref-if-color"></html:label>
      <html:input
        type="color"
        preference="if.color"
        class="zest-pref-autocolor"
      ></html:input>
      <button
        data-l10n-id="pref-color-auto"
        data-zest-pref="if.color"
        oncommand="
          Zotero.__addonInstance__.hooks.onPrefsEvent('color-auto', {
            window,
            pref: 'if.color',
          })
        "
        native="true"
      />
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-group-datasets"></html:h2></label>
    <hbox align="center">
      <button
        data-l10n-id="pref-dataset-import"
        oncommand="
          Zotero.__addonInstance__.hooks.onPrefsEvent('dataset-import', {
            window,
          })
        "
      />
    </hbox>
    <vbox id="zest-pref-datasets" class="zest-pref-list"></vbox>
    <description
      class="zest-pref-hint"
      data-l10n-id="pref-datasets-hint"
    ></description>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-group-annots"></html:h2></label>
    <checkbox
      preference="column.annots.enable"
      data-l10n-id="pref-column-annots"
      native="true"
    />
    <hbox align="center">
      <html:label data-l10n-id="pref-annots-style"></html:label>
      <menulist preference="annots.style" native="true">
        <menupopup>
          <menuitem value="bar" data-l10n-id="pref-annots-style-bar" />
          <menuitem value="stack" data-l10n-id="pref-annots-style-stack" />
          <menuitem value="circle" data-l10n-id="pref-annots-style-circle" />
        </menupopup>
      </menulist>
      <html:label
        data-l10n-id="pref-annots-color"
        style="margin-inline-start: 12px"
      ></html:label>
      <html:input
        type="color"
        preference="annots.color"
        class="zest-pref-autocolor"
      ></html:input>
      <button
        data-l10n-id="pref-color-auto"
        data-zest-pref="annots.color"
        oncommand="
          Zotero.__addonInstance__.hooks.onPrefsEvent('color-auto', {
            window,
            pref: 'annots.color',
          })
        "
        native="true"
      />
    </hbox>
    <description
      class="zest-pref-hint"
      data-l10n-id="pref-annots-hint"
    ></description>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-group-views"></html:h2></label>
    <vbox id="zest-pref-views" class="zest-pref-list"></vbox>
    <description
      class="zest-pref-hint"
      data-l10n-id="pref-views-hint"
    ></description>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-group-graph"></html:h2></label>
    <checkbox
      preference="graph.visible"
      data-l10n-id="pref-graph-visible"
      native="true"
    />
    <hbox align="center">
      <html:label data-l10n-id="pref-graph-mode"></html:label>
      <menulist preference="graph.mode" native="true">
        <menupopup>
          <menuitem value="related" data-l10n-id="pref-graph-mode-related" />
          <menuitem value="author" data-l10n-id="pref-graph-mode-author" />
          <menuitem value="tag" data-l10n-id="pref-graph-mode-tag" />
          <menuitem
            value="collection"
            data-l10n-id="pref-graph-mode-collection"
          />
        </menupopup>
      </menulist>
    </hbox>
    <hbox align="center">
      <html:label data-l10n-id="pref-graph-height"></html:label>
      <html:input
        type="number"
        min="160"
        max="900"
        preference="graph.height"
      ></html:input>
      <html:label
        data-l10n-id="pref-graph-maxnodes"
        style="margin-inline-start: 12px"
      ></html:label>
      <html:input
        type="number"
        min="30"
        max="1200"
        preference="graph.maxNodes"
      ></html:input>
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-group-collections"></html:h2></label>
    <checkbox
      preference="collectionCounts.enable"
      data-l10n-id="pref-collections-enable"
      native="true"
    />
    <hbox align="center">
      <html:label data-l10n-id="pref-collections-mode"></html:label>
      <menulist preference="collectionCounts.mode" native="true">
        <menupopup>
          <menuitem value="0" data-l10n-id="pref-collections-mode-0" />
          <menuitem value="1" data-l10n-id="pref-collections-mode-1" />
          <menuitem value="2" data-l10n-id="pref-collections-mode-2" />
        </menupopup>
      </menulist>
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-group-config"></html:h2></label>
    <hbox align="center">
      <button
        data-l10n-id="pref-config-export"
        oncommand="
          Zotero.__addonInstance__.hooks.onPrefsEvent('config-export', {
            window,
          })
        "
      />
      <button
        data-l10n-id="pref-config-import"
        oncommand="
          Zotero.__addonInstance__.hooks.onPrefsEvent('config-import', {
            window,
          })
        "
      />
    </hbox>
    <description
      class="zest-pref-hint"
      data-l10n-id="pref-config-hint"
    ></description>
  </groupbox>
  <groupbox>
    <label><html:h2 data-l10n-id="pref-group-authors"></html:h2></label>
    <checkbox
      preference="column.authors.enable"
      data-l10n-id="pref-column-authors"
      native="true"
    />
    <checkbox
      preference="column.firstAuthor.enable"
      data-l10n-id="pref-column-first-author"
      native="true"
    />
    <checkbox
      preference="column.lastAuthor.enable"
      data-l10n-id="pref-column-last-author"
      native="true"
    />
    <hbox align="center">
      <html:label data-l10n-id="pref-authors-preset"></html:label>
      <menulist preference="authors.preset" native="true">
        <menupopup>
          <menuitem value="all" data-l10n-id="pref-authors-preset-all" />
          <menuitem value="first" data-l10n-id="pref-authors-preset-first" />
          <menuitem value="last" data-l10n-id="pref-authors-preset-last" />
          <menuitem
            value="first-last"
            data-l10n-id="pref-authors-preset-firstlast"
          />
          <menuitem value="first3" data-l10n-id="pref-authors-preset-first3" />
          <menuitem
            value="advisor"
            data-l10n-id="pref-authors-preset-advisor"
          />
        </menupopup>
      </menulist>
      <html:label
        data-l10n-id="pref-authors-count"
        style="margin-inline-start: 12px"
      ></html:label>
      <html:input
        type="number"
        min="1"
        max="20"
        style="width: 5em"
        preference="authors.count"
      ></html:input>
    </hbox>
    <hbox align="center">
      <html:label data-l10n-id="pref-authors-order"></html:label>
      <menulist preference="authors.order" native="true">
        <menupopup>
          <menuitem value="auto" data-l10n-id="pref-authors-order-auto" />
          <menuitem
            value="given-family"
            data-l10n-id="pref-authors-order-given"
          />
          <menuitem
            value="family-given"
            data-l10n-id="pref-authors-order-family"
          />
        </menupopup>
      </menulist>
      <html:label

          <menuitem

    <hbox align="center">

      <html:input
        type="text"
        style="width: 5em"

      <html:label

      <html:label
        data-l10n-id="pref-authors-omitted"

      ></html:label>
      <html:input
        type="text"
        style="width: 4em"

      ></html:input>

    <hbox align="center">

    />
    <checkbox

        style="flex: 1"
      ></html:input>
      <button
        data-l10n-id="pref-key-save"
        oncommand="
          Zotero.__addonInstance__.hooks.onPrefsEvent('s2key-save', { window })

      <button

      data-l10n-id="pref-s2key-hint"
    ></description>
    <hbox align="center">
      <html:label data-l10n-id="pref-cite-stale"></html:label>

    <description
      class="zest-pref-hint"
      data-l10n-id="pref-cite-hint"

  <groupbox>
    <label><html:h2 data-l10n-id="pref-group-panel"></html:h2></label>

    />
    <checkbox
      preference="info.abstract"
      data-l10n-id="pref-info-abstract"

    />

    >
  </groupbox>
