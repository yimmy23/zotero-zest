<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
  <html:link
    rel="stylesheet"
    href="chrome://__addonRef__/content/preferences.css"
  />
</linkset>
<vbox
  id="zest-prefs"
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <html:header class="zest-pref-intro">
    <html:p data-l10n-id="pref-intro"></html:p>
    <html:nav
      id="zest-pref-navigation"
      class="zest-pref-navigation"
      data-l10n-id="pref-navigation"
    >
      <html:section
        class="zest-pref-nav-group"
        aria-labelledby="zest-pref-nav-reading"
      >
        <html:h3
          id="zest-pref-nav-reading"
          data-l10n-id="pref-navigation-reading"
        ></html:h3>
        <html:ul
          id="zest-pref-nav-reading-links"
          class="zest-pref-nav-links"
        ></html:ul>
      </html:section>
      <html:section
        class="zest-pref-nav-group"
        aria-labelledby="zest-pref-nav-bibliography"
      >
        <html:h3
          id="zest-pref-nav-bibliography"
          data-l10n-id="pref-navigation-bibliography"
        ></html:h3>
        <html:ul
          id="zest-pref-nav-bibliography-links"
          class="zest-pref-nav-links"
        ></html:ul>
      </html:section>
      <html:section
        class="zest-pref-nav-group"
        aria-labelledby="zest-pref-nav-workspace"
      >
        <html:h3
          id="zest-pref-nav-workspace"
          data-l10n-id="pref-navigation-workspace"
        ></html:h3>
        <html:ul
          id="zest-pref-nav-workspace-links"
          class="zest-pref-nav-links"
        ></html:ul>
      </html:section>
      <html:section
        class="zest-pref-nav-group"
        aria-labelledby="zest-pref-nav-appearance"
      >
        <html:h3
          id="zest-pref-nav-appearance"
          data-l10n-id="pref-navigation-appearance"
        ></html:h3>
        <html:ul
          id="zest-pref-nav-appearance-links"
          class="zest-pref-nav-links"
        ></html:ul>
      </html:section>
      <html:section
        class="zest-pref-nav-group"
        aria-labelledby="zest-pref-nav-advanced"
      >
        <html:h3
          id="zest-pref-nav-advanced"
          data-l10n-id="pref-navigation-advanced"
        ></html:h3>
        <html:ul
          id="zest-pref-nav-advanced-links"
          class="zest-pref-nav-links"
        ></html:ul>
      </html:section>
    </html:nav>
  </html:header>
  <groupbox data-zest-pref-task="workspace">
    <label><html:h2 data-l10n-id="pref-group-columns"></html:h2></label>
    <checkbox
      preference="column.reading.enable"
      data-l10n-id="pref-column-reading"
      native="true"
    />
    <checkbox
      preference="column.status.enable"
      data-l10n-id="pref-column-status"
      native="true"
    />
    <checkbox
      preference="column.rating.enable"
      data-l10n-id="pref-column-rating"
      native="true"
    />
    <checkbox
      preference="column.tags.enable"
      data-l10n-id="pref-column-tags"
      native="true"
    />
    <checkbox
      preference="tags.hideInTitle"
      data-l10n-id="pref-tags-hide-in-title"
      native="true"
    />
    <checkbox
      preference="column.textTags.enable"
      data-l10n-id="pref-column-texttags"
      native="true"
    />
    <hbox align="center">
      <html:label
        data-l10n-id="pref-texttags-match"
        id="zest-pref-texttags-match-label"
        for="zest-pref-texttags-match"
      ></html:label>
      <html:input
        type="text"
        style="flex: 1"
        preference="textTags.match"
        aria-describedby="zest-pref-texttags-match-hint"
        aria-labelledby="zest-pref-texttags-match-label"
        id="zest-pref-texttags-match"
      ></html:input>
    </hbox>
    <html:details class="zest-pref-details">
      <html:summary data-l10n-id="pref-texttags-syntax"></html:summary>
      <description
        id="zest-pref-texttags-match-hint"
        class="zest-pref-hint"
        data-l10n-id="pref-texttags-match-hint"
      ></description>
    </html:details>
    <hbox align="center">
      <html:label
        data-l10n-id="pref-texttags-color"
        id="zest-pref-texttags-color-label"
        for="zest-pref-texttags-color"
      ></html:label>
      <html:input
        type="color"
        preference="textTags.color"
        aria-labelledby="zest-pref-texttags-color-label"
        id="zest-pref-texttags-color"
      ></html:input>
      <html:label
        data-l10n-id="pref-texttags-textcolor"
        style="margin-inline-start: 12px"
        id="zest-pref-texttags-textcolor-label"
        for="zest-pref-texttags-textcolor"
      ></html:label>
      <html:input
        type="text"
        style="width: 8em"
        preference="textTags.textColor"
        aria-labelledby="zest-pref-texttags-textcolor-label"
        id="zest-pref-texttags-textcolor"
      ></html:input>
    </hbox>
    <hbox align="center">
      <html:label
        data-l10n-id="pref-rating-display"
        id="zest-pref-rating-display-label"
      ></html:label>
      <menulist
        id="zest-pref-rating-display"
        preference="rating.display"
        native="true"
        aria-labelledby="zest-pref-rating-display-label"
      >
        <menupopup>
          <menuitem data-l10n-id="pref-rating-display-column" value="column" />
          <menuitem data-l10n-id="pref-rating-display-title" value="title" />
          <menuitem data-l10n-id="pref-rating-display-both" value="both" />
        </menupopup>
      </menulist>
      <button
        id="zest-pref-rating-import"
        data-l10n-id="pref-rating-import"
        oncommand="
          Zotero.__addonInstance__.hooks.onPrefsEvent('rating-import', {
            window,
          })
        "
      />
    </hbox>
    <description
      class="zest-pref-hint"
      data-l10n-id="pref-rating-display-hint"
    ></description>
    <hbox align="center">
      <html:label
        data-l10n-id="pref-rating-mark"
        id="zest-pref-rating-mark-label"
        for="zest-pref-rating-mark"
      ></html:label>
      <html:input
        type="text"
        style="width: 3em"
        preference="rating.mark"
        aria-labelledby="zest-pref-rating-mark-label"
        id="zest-pref-rating-mark"
      ></html:input>
      <html:label
        data-l10n-id="pref-rating-option"
        style="margin-inline-start: 12px"
        id="zest-pref-rating-option-label"
        for="zest-pref-rating-option"
      ></html:label>
      <html:input
        type="text"
        style="width: 3em"
        preference="rating.option"
        aria-labelledby="zest-pref-rating-option-label"
        id="zest-pref-rating-option"
      ></html:input>
      <html:label
        data-l10n-id="pref-rating-color"
        style="margin-inline-start: 12px"
        id="zest-pref-rating-color-label"
        for="zest-pref-rating-color"
      ></html:label>
      <html:input
        type="text"
        style="width: 7em"
        preference="rating.color"
        aria-labelledby="zest-pref-rating-color-label"
        id="zest-pref-rating-color"
      ></html:input>
      <html:label
        data-l10n-id="pref-rating-key"
        style="margin-inline-start: 12px"
        id="zest-pref-rating-key-label"
      ></html:label>
      <menulist
        preference="rating.extraKey"
        native="true"
        aria-labelledby="zest-pref-rating-key-label"
        id="zest-pref-rating-key"
      >
        <menupopup>
          <menuitem label="rate" value="rate" />
          <menuitem label="Rating" value="Rating" />
        </menupopup>
      </menulist>
    </hbox>
    <checkbox
      preference="extra.stripOnExport"
      data-l10n-id="pref-extra-strip"
      native="true"
    />
  </groupbox>

  <groupbox data-zest-pref-task="appearance">
    <label><html:h2 data-l10n-id="pref-group-appearance"></html:h2></label>
    <description
      class="zest-pref-hint"
      data-l10n-id="pref-accent-hint"
    ></description>
    <hbox align="center">
      <html:label
        data-l10n-id="pref-accent-color"
        id="zest-pref-accent-color-label"
        for="zest-pref-accent-color"
      ></html:label>
      <html:input
        type="color"
        preference="ui.accent"
        aria-labelledby="zest-pref-accent-color-label"
        id="zest-pref-accent-color"
      ></html:input>
      <html:div
        id="zest-pref-accent-presets"
        class="zest-pref-swatches"
      ></html:div>
    </hbox>
    <hbox align="center">
      <button
        id="zest-pref-accent-apply"
        data-l10n-id="pref-accent-apply"
        oncommand="
          Zotero.__addonInstance__.hooks.onPrefsEvent('accent-apply', {
            window,
          })
        "
        native="true"
      />
      <button
        id="zest-pref-accent-reset"
        data-l10n-id="pref-accent-reset"
        oncommand="
          Zotero.__addonInstance__.hooks.onPrefsEvent('accent-reset', {
            window,
          })
        "
        native="true"
      />
    </hbox>
    <description
      class="zest-pref-hint"
      data-l10n-id="pref-accent-apply-hint"
    ></description>
  </groupbox>

  <groupbox data-zest-pref-task="reading">
    <label><html:h2 data-l10n-id="pref-group-heat"></html:h2></label>
    <checkbox
      preference="titleDecor.heat"
      data-l10n-id="pref-titledecor-heat"
      native="true"
    />
    <checkbox
      preference="titleDecor.unreadBold"
      data-l10n-id="pref-titledecor-unread"
      native="true"
    />
    <checkbox
      preference="titleDecor.unreadIncludesEmpty"
      data-l10n-id="pref-titledecor-unread-empty"
      native="true"
      style="margin-inline-start: 20px"
    />
    <hbox align="center">
      <html:label
        data-l10n-id="pref-heat-color"
        id="zest-pref-heat-color-label"
        for="zest-pref-heat-color"
      ></html:label>
      <html:input
        type="color"
        preference="heat.color"
        aria-labelledby="zest-pref-heat-color-label"
        id="zest-pref-heat-color"
      ></html:input>
      <html:label
        data-l10n-id="pref-heat-opacity"
        style="margin-inline-start: 12px"
        id="zest-pref-heat-opacity-label"
        for="zest-pref-heat-opacity"
      ></html:label>
      <html:input
        type="number"
        min="0.1"
        max="1"
        step="0.05"
        preference="heat.opacity"
        aria-labelledby="zest-pref-heat-opacity-label"
        id="zest-pref-heat-opacity"
      ></html:input>
    </hbox>
  </groupbox>

  <groupbox data-zest-pref-task="reading">
    <label><html:h2 data-l10n-id="pref-group-tracker"></html:h2></label>
    <checkbox
      preference="tracker.enable"
      data-l10n-id="pref-tracker-enable"
      native="true"
    />
    <hbox align="center">
      <html:label
        data-l10n-id="pref-tracker-idle"
        id="zest-pref-tracker-idle-label"
        for="zest-pref-tracker-idle"
      ></html:label>
      <html:input
        type="number"
        min="10"
        max="3600"
        preference="tracker.idleSeconds"
        aria-labelledby="zest-pref-tracker-idle-label"
        id="zest-pref-tracker-idle"
      ></html:input>
    </hbox>
    <checkbox
      preference="status.derive"
      data-l10n-id="pref-status-derive"
      native="true"
    />
    <checkbox
      preference="statusAuto.enable"
      data-l10n-id="pref-statusauto-enable"
      native="true"
    />
    <checkbox
      preference="statusAuto.markEmpty"
      data-l10n-id="pref-statusauto-markempty"
      native="true"
      style="margin-inline-start: 20px"
    />
    <hbox align="center">
      <html:label
        data-l10n-id="pref-statusauto-threshold"
        id="zest-pref-statusauto-threshold-label"
        for="zest-pref-statusauto-threshold"
      ></html:label>
      <html:input
        type="number"
        min="10"
        max="100"
        preference="statusAuto.readThreshold"
        aria-labelledby="zest-pref-statusauto-threshold-label"
        id="zest-pref-statusauto-threshold"
      ></html:input>
      <html:label
        data-l10n-id="pref-statusauto-minminutes"
        style="margin-inline-start: 12px"
        id="zest-pref-statusauto-minminutes-label"
        for="zest-pref-statusauto-minminutes"
      ></html:label>
      <html:input
        type="number"
        min="0"
        max="600"
        preference="statusAuto.minMinutes"
        aria-labelledby="zest-pref-statusauto-minminutes-label"
        id="zest-pref-statusauto-minminutes"
      ></html:input>
    </hbox>
    <description
      class="zest-pref-hint"
      data-l10n-id="pref-tracker-storage-hint"
    ></description>
  </groupbox>

  <groupbox data-zest-pref-task="advanced">
    <label><html:h2 data-l10n-id="pref-group-data"></html:h2></label>
    <hbox align="center">
      <button
        data-l10n-id="pref-btn-migrate"
        oncommand="
          Zotero.__addonInstance__.hooks.onPrefsEvent('migrate', { window })
        "
      />
      <button
        data-l10n-id="pref-btn-export-json"
        oncommand="
          Zotero.__addonInstance__.hooks.onPrefsEvent('export-json', { window })
        "
      />
      <button
        data-l10n-id="pref-btn-export-csv"
        oncommand="
          Zotero.__addonInstance__.hooks.onPrefsEvent('export-csv', { window })
        "
      />
      <button
        data-l10n-id="pref-btn-import"
        oncommand="
          Zotero.__addonInstance__.hooks.onPrefsEvent('import', { window })
        "
      />
    </hbox>
    <description class="zest-pref-hint" id="zest-pref-dbpath"></description>
  </groupbox>

  <groupbox data-zest-pref-task="workspace">
    <label><html:h2 data-l10n-id="pref-group-tags"></html:h2></label>
    <checkbox
      preference="nestedTags.show"
      data-l10n-id="pref-nested-show"
      native="true"
    />
    <hbox align="center">
      <html:label
        data-l10n-id="pref-nested-link"
        id="zest-pref-nested-link-label"
      ></html:label>
      <menulist
        preference="nestedTags.linkSymbol"
        native="true"
        aria-labelledby="zest-pref-nested-link-label"
        id="zest-pref-nested-link"
      >
        <menupopup>
          <menuitem value="/" label="/" />
          <menuitem value="\" label="\" />
          <menuitem value="." label="." />
          <menuitem value="_" label="_" />
          <menuitem value="+" label="+" />
          <menuitem value="-" label="-" />
          <menuitem value=":" label=":" />
          <menuitem value="~" label="~" />
          <menuitem value=">" label=">" />
          <menuitem value="&lt;" label="&lt;" />
        </menupopup>
      </menulist>
      <html:label
        data-l10n-id="pref-nested-sort"
        style="margin-inline-start: 12px"
        id="zest-pref-nested-sort-label"
      ></html:label>
      <menulist
        preference="nestedTags.sort"
        native="true"
        aria-labelledby="zest-pref-nested-sort-label"
        id="zest-pref-nested-sort"
      >
        <menupopup>
          <menuitem value="az" data-l10n-id="pref-nested-sort-az" />
          <menuitem value="za" data-l10n-id="pref-nested-sort-za" />
          <menuitem
            value="freq-desc"
            data-l10n-id="pref-nested-sort-freq-desc"
          />
          <menuitem value="freq-asc" data-l10n-id="pref-nested-sort-freq-asc" />
        </menupopup>
      </menulist>
    </hbox>
    <checkbox
      preference="nestedTags.matchChildTags"
      data-l10n-id="pref-nested-childtags"
      native="true"
    />
    <description
      class="zest-pref-hint"
      data-l10n-id="pref-nested-hint"
    ></description>
  </groupbox>

  <groupbox data-zest-pref-task="bibliography">
    <label><html:h2 data-l10n-id="pref-group-rank"></html:h2></label>
    <checkbox
      preference="column.pubtags.enable"
      data-l10n-id="pref-column-pubtags"
      native="true"
    />
    <checkbox
      preference="column.if.enable"
      data-l10n-id="pref-column-if"
      native="true"
    />
    <checkbox
      preference="column.venue.enable"
      data-l10n-id="pref-column-venue"
      native="true"
    />
    <hbox align="center">
      <html:label
        data-l10n-id="pref-rank-fields"
        id="zest-pref-rank-fields-label"
        for="zest-pref-rank-fields"
      ></html:label>
      <html:input
        type="text"
        style="flex: 1"
        preference="rank.fields"
        aria-labelledby="zest-pref-rank-fields-label"
        id="zest-pref-rank-fields"
      ></html:input>
    </hbox>
    <description
      class="zest-pref-hint"
      data-l10n-id="pref-rank-fields-hint"
    ></description>
    <hbox align="center">
      <html:label
        data-l10n-id="pref-rank-sortby"
        id="zest-pref-rank-sortby-label"
        for="zest-pref-rank-sortby"
      ></html:label>
      <html:input
        type="text"
        style="flex: 1"
        preference="rank.sortBy"
        aria-labelledby="zest-pref-rank-sortby-label"
        id="zest-pref-rank-sortby"
      ></html:input>
    </hbox>
    <description
      class="zest-pref-hint"
      data-l10n-id="pref-rank-sortby-hint"
    ></description>
    <hbox align="center">
      <html:label
        data-l10n-id="pref-rank-map"
        id="zest-pref-rank-map-label"
        for="zest-pref-rank-map"
      ></html:label>
      <html:input
        type="text"
        style="flex: 1"
        preference="rank.map"
        aria-describedby="zest-pref-rank-map-hint"
        aria-labelledby="zest-pref-rank-map-label"
        id="zest-pref-rank-map"
      ></html:input>
    </hbox>
    <html:details class="zest-pref-details">
      <html:summary data-l10n-id="pref-rank-map-syntax"></html:summary>
      <description
        id="zest-pref-rank-map-hint"
        class="zest-pref-hint"
        data-l10n-id="pref-rank-map-hint"
      ></description>
    </html:details>
    <hbox align="center">
      <html:label
        data-l10n-id="pref-rank-colors"
        id="zest-pref-rank-colors-label"
        for="zest-pref-rank-colors"
      ></html:label>
      <html:input
        type="text"
        style="flex: 1"
        preference="rank.colors"
        aria-labelledby="zest-pref-rank-colors-label"
        id="zest-pref-rank-colors"
      ></html:input>
    </hbox>
    <description
      class="zest-pref-hint"
      data-l10n-id="pref-rank-colors-hint"
    ></description>
    <hbox align="center">
      <html:label
        data-l10n-id="pref-rank-defaultcolor"
        id="zest-pref-rank-defaultcolor-label"
        for="zest-pref-rank-defaultcolor"
      ></html:label>
      <html:input
        type="color"
        preference="rank.defaultColor"
        class="zest-pref-autocolor"
        aria-labelledby="zest-pref-rank-defaultcolor-label"
        id="zest-pref-rank-defaultcolor"
      ></html:input>
      <button
        data-l10n-id="pref-color-auto"
        data-zest-pref="rank.defaultColor"
        oncommand="
          Zotero.__addonInstance__.hooks.onPrefsEvent('color-auto', {
            window,
            pref: 'rank.defaultColor',
          })
        "
        native="true"
      />
      <html:label
        data-l10n-id="pref-rank-textcolor"
        style="margin-inline-start: 12px"
        id="zest-pref-rank-textcolor-label"
        for="zest-pref-rank-textcolor"
      ></html:label>
      <html:input
        type="text"
        style="width: 8em"
        preference="rank.textColor"
        aria-labelledby="zest-pref-rank-textcolor-label"
        id="zest-pref-rank-textcolor"
      ></html:input>
      <html:label
        data-l10n-id="pref-rank-opacity"
        style="margin-inline-start: 12px"
        id="zest-pref-rank-opacity-label"
        for="zest-pref-rank-opacity"
      ></html:label>
      <html:input
        type="text"
        style="width: 5em"
        preference="rank.opacity"
        aria-labelledby="zest-pref-rank-opacity-label"
        id="zest-pref-rank-opacity"
      ></html:input>
    </hbox>
    <hbox align="center">
      <html:label
        data-l10n-id="pref-rank-ttl"
        id="zest-pref-rank-ttl-label"
        for="zest-pref-rank-ttl"
      ></html:label>
      <html:input
        type="number"
        min="0"
        max="3650"
        preference="rank.ttlDays"
        aria-labelledby="zest-pref-rank-ttl-label"
        id="zest-pref-rank-ttl"
      ></html:input>
    </hbox>
    <checkbox
      preference="rank.useEasyScholar"
      data-l10n-id="pref-rank-easyscholar"
      native="true"
    />
    <checkbox
      preference="rank.useOpenAlex"
      data-l10n-id="pref-rank-openalex"
      native="true"
    />
    <checkbox
      preference="rank.autoFetch"
      data-l10n-id="pref-rank-autofetch"
      native="true"
    />
    <hbox align="center">
      <html:label
        data-l10n-id="pref-key-label"
        id="zest-pref-eskey-label"
        for="zest-pref-eskey"
      ></html:label>
      <html:input
        type="password"
        id="zest-pref-eskey"
        class="zest-pref-key"
        style="flex: 1"
        aria-labelledby="zest-pref-eskey-label"
      ></html:input>
      <button
        data-l10n-id="pref-key-save"
        oncommand="
          Zotero.__addonInstance__.hooks.onPrefsEvent('key-save', { window })
        "
      />
      <button
        data-l10n-id="pref-key-test"
        oncommand="
          Zotero.__addonInstance__.hooks.onPrefsEvent('key-test', { window })
        "
      />
    </hbox>
    <description id="zest-pref-keystatus" class="zest-pref-hint"></description>
    <description
      class="zest-pref-hint"
      data-l10n-id="pref-key-hint"
    ></description>
    <button
